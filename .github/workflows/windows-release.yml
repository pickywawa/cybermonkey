name: Windows installer
# Builds the Windows (x64) installer on a real Windows runner and attaches it to the release.
# Runs when a release is published, or by hand (give a tag to attach to a release; leave it empty to only build).
on:
  # temporary: lets the branch be tested before the workflow exists on main
  push:
    branches: [windows-port]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the installer to (e.g. v1.2.0). Empty = build only.'
        required: false
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
      - name: Smoke test the packaged app (native binaries present and loading)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          & ./release/win-unpacked/Cybermonkey.exe ./scripts/smoke-packaged.cjs ./release/win-unpacked
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed ($LASTEXITCODE)" }
      - name: Start the packaged app and make sure it stays up
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $p = Start-Process ./release/win-unpacked/Cybermonkey.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Cybermonkey exited at startup with code $($p.ExitCode)" }
          Write-Host "Cybermonkey is running (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: cybermonkey-windows-installer
          path: release/Cybermonkey-*-win-x64.exe
          retention-days: 7
      - name: Attach the installer to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/Cybermonkey-*-win-x64.exe --clobber
